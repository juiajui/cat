<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>激戰之地助手 v1.4</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="任務助手">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "a7a8a1b0-bca1-4066-8a01-5bcb5ea204cd",
          serviceWorkerPath: 'OneSignalSDKWorker.js',
          allowLocalhostAsSecureOrigin: true
        });
      });
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; padding: 15px; background-color: #f4f7f9; margin: 0; }
        .container { width: 100%; max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 15px; font-size: 1.2rem; text-align: center; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #e0e0e0; border-radius: 8px; font-weight: bold; color: #666; cursor: pointer; }
        .tab-btn.active { background: #3498db; color: white; box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn-ready { width: 100%; padding: 14px; background: #2ecc71; color: white; border: none; border-radius: 10px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        #addBtn { width: 100%; padding: 16px; background: #3498db; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        
        .form-grid { display: flex; flex-direction: column; gap: 12px; }
        
        select, input { -webkit-appearance: none; padding: 12px; border: 1px solid #dcdfe6; border-radius: 10px; font-size: 16px; width: 100%; background: #fff; height: 45px; }
        label { font-size: 14px; color: #666; font-weight: bold; margin-bottom: -8px; margin-left: 5px; }

        .time-row { display: flex; gap: 5px; }
        .time-col { flex: 1; }
        .time-col span { display: block; font-size: 12px; text-align: center; color: #999; margin-bottom: 2px; }

        .radio-group { display: flex; gap: 10px; margin-top: 5px; }
        .radio-option { flex: 1; }
        .radio-option input { display: none; }
        .radio-option span { display: block; text-align: center; padding: 10px; border: 1px solid #dcdfe6; border-radius: 8px; background: #f8f9fa; color: #666; cursor: pointer; transition: all 0.2s; font-weight: bold; }
        .radio-option input:checked + span { background: #3498db; color: white; border-color: #3498db; }
        
        /* 戰況三種顏色的特別處理 */
        .radio-option input[value="10"]:checked + span { background: #3498db; border-color: #3498db; }
        .radio-option input[value="185"]:checked + span { background: #e74c3c; border-color: #e74c3c; }
        .radio-option input[value="324"]:checked + span { background: #9b59b6; border-color: #9b59b6; }
        
        .radio-option input[value="王"]:checked + span { background: #f39c12; border-color: #f39c12; }
        
        #debug-log { margin-top: 20px; padding: 10px; background: #1a1a1a; color: #00ff00; font-family: monospace; font-size: 11px; border-radius: 8px; height: 120px; overflow-y: auto; }
        .table-container { width: 100%; overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 300px; font-size: 13px; }
        td, th { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        
        .tag { font-size: 11px; padding: 2px 4px; border-radius: 4px; color: white; margin-right: 2px; }
        .tag-10 { background: #3498db; } 
        .tag-185 { background: #e74c3c; } 
        .tag-324 { background: #9b59b6; } 
        .tag-boss { background: #f39c12; }   
        .tag-upper { background: #9b59b6; }
        
        .group-input-area { background: #fff3cd; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ffeeba; }
        .group-input-area p { margin: 0 0 5px 0; font-size: 13px; color: #856404; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>激戰之地助手 v1.4</h2>
    
    <div class="group-input-area">
        <p>🔑 群組代碼 (區分通知用)</p>
        <input type="text" id="groupCode" placeholder="請輸入代碼 (預設: public)" value="public" style="background:white;">
    </div>

    <button class="btn-ready" onclick="activatePush()">第一步：連線伺服器 (綁定群組)</button>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab1')">激戰之地</button>
        <button class="tab-btn" onclick="switchTab('tab2')">激戰之地上層</button>
    </div>

    <div id="tab1" class="tab-content active">
        <div class="form-grid">
            <label>開始時間</label>
            <input type="datetime-local" id="startTime_v1">
            
            <label>持續時間</label>
            <select id="duration_v1">
                <option value="1">1 小時</option>
                <option value="3">3 小時</option>
                <option value="6">6 小時</option>
                <option value="12">12 小時</option>
                <option value="24">24 小時</option>
                <option value="unknown">未知</option>
            </select>

            <label>戰況</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="battleMode" value="10" checked><span>10</span></label>
                <label class="radio-option"><input type="radio" name="battleMode" value="185"><span>185</span></label>
                <label class="radio-option"><input type="radio" name="battleMode" value="324"><span>324</span></label>
            </div>

            <label>階級</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="rankType" value="小怪" checked onclick="updateLevelOptions('小怪')"><span>小怪 (1-30)</span></label>
                <label class="radio-option"><input type="radio" name="rankType" value="王" onclick="updateLevelOptions('王')"><span>👑 王 (20-40)</span></label>
            </div>

            <label>任務類型</label>
            <select id="type_v1">
                <option value="🐺 狼">🐺 狼</option>
                <option value="🏴‍☠️ 海盜">🏴‍☠️ 海盜</option>
                <option value="🍎 食物">🍎 食物</option>
                <option value="🐱 貓">🐱 貓</option>
            </select>
            <label>等級</label>
            <select id="level_v1"></select>

            <button id="addBtn" onclick="addTaskV1()">新增預約 (激戰之地)</button>
        </div>
    </div>

    <div id="tab2" class="tab-content">
        <div class="form-grid">
            <label>開始時間</label>
            <input type="datetime-local" id="startTime_v2">
            <label>位置</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="floorType" value="1F" checked onclick="updateUpperFloorTypes()"><span>上層 1F</span></label>
                <label class="radio-option"><input type="radio" name="floorType" value="2F" onclick="updateUpperFloorTypes()"><span>上層 2F</span></label>
            </div>
            <label>任務類型</label>
            <select id="type_v2"></select>
            <label>到期倒數</label>
            <div class="time-row">
                <div class="time-col"><span>小時 (8-40)</span><select id="dur_h"></select></div>
                <div class="time-col"><span>分鐘 (0-59)</span><select id="dur_m"></select></div>
                <div class="time-col"><span>秒 (0-59)</span><select id="dur_s"></select></div>
            </div>
            <button id="addBtn" onclick="addTaskV2()" style="background:#9b59b6;">新增預約 (上層)</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead><tr><th>資訊</th><th>預計時間</th><th>操作</th></tr></thead>
            <tbody id="taskBody"></tbody>
        </table>
    </div>
    <div id="debug-log">等待操作...<br></div>
</div>

<script>
    let savedTasks = JSON.parse(localStorage.getItem('myTasks')) || [];
    let savedGroup = localStorage.getItem('myGroupCode') || "public";
    
    function log(msg) {
        const div = document.getElementById('debug-log');
        div.innerHTML += "> " + msg + "<br>";
        div.scrollTop = div.scrollHeight;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        const btnIndex = tabId === 'tab1' ? 0 : 1;
        document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');
    }

    async function activatePush() {
        const groupVal = document.getElementById('groupCode').value || "public";
        localStorage.setItem('myGroupCode', groupVal);

        OneSignalDeferred.push(async function(OneSignal) {
            log(`連線群組: ${groupVal}...`);
            await OneSignal.Notifications.requestPermission();
            await OneSignal.User.addTag("my_group", groupVal);
            log(`✅ 連線成功 (頻道: ${groupVal})`);
            alert(`✅ 連線成功！\n您現在位於「${groupVal}」頻道`);
        });
    }

    function saveToPhone() { localStorage.setItem('myTasks', JSON.stringify(savedTasks)); }
    
    window.deleteTask = function(index) {
        if(confirm("確定要刪除嗎？")) {
            savedTasks.splice(index, 1);
            saveToPhone();
            renderTable();
        }
    }
    
    function autoCleanExpired() {
        const now = Date.now();
        const initialCount = savedTasks.length;
        savedTasks = savedTasks.filter(task => {
            if (task.endStr === "未知" || !task.endTime) return true;
            return task.endTime > now;
        });
        if (savedTasks.length !== initialCount) {
            saveToPhone();
            renderTable();
            log("🧹 已自動清除過期任務");
        }
    }

    const LEVEL_RANGES = { '小怪': { min: 1, max: 30 }, '王': { min: 20, max: 40 } };
    function updateLevelOptions(rankType) {
        const select = document.getElementById('level_v1');
        select.innerHTML = "";
        const range = LEVEL_RANGES[rankType];
        for (let i = range.min; i <= range.max; i++) {
            let option = document.createElement("option");
            option.value = i; option.text = i;
            select.appendChild(option);
        }
    }

    const UPPER_TYPES = { '1F': ['🦀 螃蟹', '🐝 蜜蜂', '🐇 兔子', '🐀 老鼠'], '2F': ['😱 驚驚', '🧶 手工', '🧸 玩具', '🍌 香蕉'] };
    function updateUpperFloorTypes() {
        const floor = document.querySelector('input[name="floorType"]:checked').value;
        const select = document.getElementById('type_v2');
        select.innerHTML = "";
        UPPER_TYPES[floor].forEach(type => {
            let option = document.createElement("option");
            option.value = type; option.text = type;
            select.appendChild(option);
        });
    }

    function initTimeSelectors() {
        const selH = document.getElementById('dur_h');
        const selM = document.getElementById('dur_m');
        const selS = document.getElementById('dur_s');
        for(let i=8; i<=40; i++) selH.add(new Option(i, i));
        for(let i=0; i<=59; i++) selM.add(new Option(i, i));
        for(let i=0; i<=59; i++) selS.add(new Option(i, i));
    }

    async function addTaskV1() {
        const startVal = document.getElementById('startTime_v1').value;
        const durVal = document.getElementById('duration_v1').value;
        const typeVal = document.getElementById('type_v1').value;
        const levelVal = document.getElementById('level_v1').value;
        const modeVal = document.querySelector('input[name="battleMode"]:checked').value; // 10, 185, 324
        const rankVal = document.querySelector('input[name="rankType"]:checked').value;

        if (durVal === 'unknown') {
            saveTask({ source:'v1', mode: modeVal, rank: rankVal, type: typeVal, lv: levelVal, endStr: "未知" });
            return;
        }

        const startDate = new Date(startVal);
        const durationHours = parseFloat(durVal);
        const visualEndDate = new Date(startDate.getTime() + durationHours * 3600000);

        // 通知前綴改為 [代碼]
        let prefix = `[${modeVal}]`;
        if (rankVal === "王") prefix += "[王]";
        
        let notifyTime;
        let finalMessage = "";

        // 判斷邏輯：如果是王且不是選10 (意即選了 185 或 324)
        if (rankVal === "王" && modeVal !== "10") {
            notifyTime = new Date(startDate.getTime() + (3.5 * 3600000));
            finalMessage = `${prefix} [${typeVal}]LV${levelVal} 即將4小時隨時會消失`;
        } else {
            // 一般小怪或 10 號王
            if (durationHours === 1) {
                notifyTime = new Date(startDate.getTime() + (26 * 60000));
            } else if (durationHours === 3) {
                notifyTime = new Date(startDate.getTime() + (91 * 60000));
            } else if (durationHours === 6) {
                notifyTime = new Date(startDate.getTime() + (261 * 60000));
            } else {
                notifyTime = new Date(visualEndDate.getTime() - 1800000);
            }
            
            const timeStr = visualEndDate.toLocaleString('zh-TW', {hour:'2-digit', minute:'2-digit', hour12:false});
            finalMessage = `${prefix} [${typeVal}]LV${levelVal},將於${timeStr}消失`;
        }
        
        await scheduleNotification(notifyTime, finalMessage);
        
        saveTask({
            source: 'v1', mode: modeVal, rank: rankVal, type: typeVal, lv: levelVal,
            endTime: visualEndDate.getTime(),
            endStr: visualEndDate.toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false})
        });
    }

    async function addTaskV2() {
        const startVal = document.getElementById('startTime_v2').value;
        const floorVal = document.querySelector('input[name="floorType"]:checked').value;
        const typeVal = document.getElementById('type_v2').value;
        const h = parseInt(document.getElementById('dur_h').value);
        const m = parseInt(document.getElementById('dur_m').value);
        const s = parseInt(document.getElementById('dur_s').value);

        if (!startVal) return alert('請確認時間');
        const addMs = (h * 3600 + m * 60 + s) * 1000;
        const endDate = new Date(new Date(startVal).getTime() + addMs);
        
        const notifyTime = new Date(endDate.getTime() - 1800000);
        const timeStr = endDate.toLocaleString('zh-TW', {hour:'2-digit', minute:'2-digit', hour12:false});

        await scheduleNotification(notifyTime, `[上層${floorVal}] ${typeVal},將於${timeStr}出現`);

        saveTask({
            source: 'v2', floor: floorVal, type: typeVal,
            endTime: endDate.getTime(),
            endStr: endDate.toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false})
        });
    }

    async function scheduleNotification(notifyTime, messageContent) {
        const currentGroup = document.getElementById('groupCode').value || "public";

        if (notifyTime <= new Date()) return alert("時間已過，無法預約通知！(僅存檔)");

        try {
            const response = await fetch("/api/schedule", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    notifyAt: notifyTime.toISOString(),
                    message: messageContent,
                    group: currentGroup
                })
            });
            const result = await response.json();
            if (result.id) alert("✅ 預約成功！");
            else alert("預約失敗");
        } catch (e) { log("連線錯誤:" + e); }
    }

    function saveTask(taskObj) {
        savedTasks.unshift(taskObj);
        saveToPhone();
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('taskBody');
        tbody.innerHTML = ""; 
        savedTasks.forEach((task, index) => {
            let infoHTML = "";
            if (task.source === 'v2') {
                infoHTML = `<span class="tag tag-upper">${task.floor}</span> ${task.type}`;
            } else {
                let tags = "";
                // 根據模式加上不同的 tag 顏色
                if (task.mode === "10") tags += `<span class="tag tag-10">10</span>`;
                if (task.mode === "185") tags += `<span class="tag tag-185">185</span>`;
                if (task.mode === "324") tags += `<span class="tag tag-324">324</span>`;
                if (task.rank === "王") tags += `<span class="tag tag-boss">王</span>`;
                infoHTML = `${tags} ${task.type} <small>(Lv.${task.lv})</small>`;
            }
            const row = document.createElement('tr');
            row.innerHTML = `<td>${infoHTML}</td><td style="font-size:12px">${task.endStr}</td><td><button onclick="deleteTask(${index})" style="color:red; border:none; background:none; font-weight:bold;">刪</button></td>`;
            tbody.appendChild(row);
        });
    }

    window.onload = function() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        const isoNow = now.toISOString().slice(0,16); 
        document.getElementById('startTime_v1').value = isoNow;
        document.getElementById('startTime_v2').value = isoNow;
        
        document.getElementById('groupCode').value = savedGroup;

        updateLevelOptions('小怪');
        updateUpperFloorTypes();
        initTimeSelectors();
        autoCleanExpired(); 
        setInterval(autoCleanExpired, 30000);
        renderTable(); 
    };
</script>
</body>
</html>
